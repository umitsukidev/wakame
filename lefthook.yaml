pre-commit:
  parallel: true
  commands:
    oxc:
      run: |
        pnpm exec oxlint --fix --no-error-on-unmatched-pattern {staged_files} &&
        pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    rustfmt:
      glob: "*.rs"
      run: rustfmt {staged_files}
      stage_fixed: true
    cargo-check:
      run: cargo clippy --workspace --locked

pre-push:
  parallel: true
  commands:
    oxlint:
      run: pnpm exec oxlint
    oxfmt:
      run: pnpm exec oxfmt --check
    cargo-fmt:
      run: cargo fmt --all --check
    cargo-check:
      run: cargo clippy --workspace --locked -- -D warnings
