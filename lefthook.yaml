pre-commit:
  commands:
    oxfmt:
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    oxlint:
      run: pnpm exec oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    rustfmt:
      glob: "*.rs"
      run: rustfmt {staged_files}
      stage_fixed: true
    cargo-check:
      run: cargo check --workspace --locked
